# ms-data-parser の外部資産の場所・置き場所・サーバの振る舞い。
#
# このファイルを lipidmix.local.toml という名前でリポジトリ直下（server.py の隣）に
# 複製して編集する。lipidmix.local.toml は git に追跡されない。
#
# - Windows のパスは単一引用符で囲む（二重引用符だと \ がエスケープとして読まれる）。
# - 相対パスは、このファイルのあるフォルダ基準で解く。
# - 外部資産の場所・置き場所・サーバの振る舞いはこのファイルだけで指す（環境変数では指せない）。
#   別の場所の設定ファイルを読ませるときだけ、起動時の環境変数 LIPIDMIX_CONFIG でそのパスを指す。
# - 書き換えは次のツール呼び出しから効く（MCP サーバの再起動は不要）。

[msdial]
# MS-DIAL Console の実行体。console_* / pipeline_* ツールを使うときだけ必要。
exe = 'C:\MS-DIAL\MSDIALCUI.exe'
# 脂質ライブラリ（.lbm2）は [library] lbm に書く（以前の [msdial] lbm は CONFIG_INVALID になる）。

[library]
# library_load(ion_mode=...) が読む参照ライブラリ（.msp）。極性ごとに 1 つ。
# msp_positive = 'D:\library\pos.msp'
# msp_negative = 'D:\library\neg.msp'
# 脂質ライブラリ（.lbm2）。任意。
# - Console（console_plan / pipeline の library_mode="auto"）: メソッドファイルの宣言・
#   MsdialWorkbench のビルド生成物が無いときにここを使い、ここも無ければ Console の
#   実行体と同じフォルダの .lbm2 から推定する。
# - pipeline の library_mode="msp_then_lbm": ここだけを読む（メソッドの宣言・実行体の
#   フォルダは見ない）。
# ここから採った LBM は、ツールの戻り値・エラーにファイル名だけで示す（置き場所は出さない）。
# lbm = 'D:\library\lipids.lbm2'

[mslipidmapper]
# 研究室サーバの MSLipidMapper REST API。書けば pathway_project / pathway_plot はまずここを使い、
# 未到達・404・ジョブ失敗などで使えなければ下の rscript（ローカルの R）へ回す。
# 書かない（または空文字）ならローカルの R だけを使う。中間 mzTab-M はサーバへ送られる。
# mslipidmapper_api_url = 'http://10.0.0.1:8000'
# サーバが認証を求めるときだけ。
# api_token = '...'
# pathway_project / pathway_plot が呼ぶ Rscript（R 4.6 系）。パッケージは R 本体ではなく
# リポジトリの renv 環境 r/ に入る。初回だけ: Rscript r/setup.R
# rscript = 'C:\Program Files\R\R-4.6.0\bin\Rscript.exe'
# pathway_plot の PDF 描画に使うヘッドレス Chromium（Chrome / Edge）。任意:
# 書かなければ Edge / Chrome の標準の置き場所から自動で探す。
# browser = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'

[paths]
# 解析の記録（objective・レポート・図）の書き込み先。任意。書けば解析フォルダ配下の reports/
# より先に試し、書き込めなければ解析フォルダ配下の reports/ へ退避する。書かなければ
# 解析フォルダ配下の reports/ だけを使う（記録は解析フォルダ側に付いて回る）。
# reports_dir = 'D:\analysis_records'
# 参照ライブラリの照合用 SQLite キャッシュ。任意。書かなければこのファイルのフォルダの
# data/.library-cache（研究室ライブラリの完全な写しなので、リポジトリに追跡させない）。
# library_cache = 'D:\cache\library'

[server]
# 同時に開いておけるデータセットのハンドルの上限（整数。既定 8、1 未満は 1）。
# max_dataset_handles = 8
# 解析出力の先頭に付く意味論ダイジェストと出力形式の案内。digest（既定）か off。
# off はローカルの操作ナビゲータ専用のデプロイ向け。ほかの値は CONFIG_INVALID。
# caveat_mode = 'digest'
