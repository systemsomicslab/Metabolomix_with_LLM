# ms-data-parser の外部資産の場所。
#
# このファイルを lipidmix.local.toml という名前でリポジトリ直下（server.py の隣）に
# 複製して編集する。lipidmix.local.toml は git に追跡されない。
#
# - Windows のパスは単一引用符で囲む（二重引用符だと \ がエスケープとして読まれる）。
# - 相対パスは、このファイルのあるフォルダ基準で解く。
# - 環境変数（MSDIAL_EXE / MSDIAL_LBM / MSDIAL_MSP_POS / MSDIAL_MSP_NEG）が
#   設定されていれば、そちらが優先される。
# - 書き換えは次のツール呼び出しから効く（MCP サーバの再起動は不要）。

[msdial]
# MS-DIAL Console の実行体。console_* / pipeline_* ツールを使うときだけ必要。
exe = 'C:\MS-DIAL\MSDIALCUI.exe'

# 脂質ライブラリ（.lbm2）。任意。書かなければメソッドファイルの宣言や、
# Console の実行体と同じフォルダの .lbm2 から推定する。
# lbm = 'C:\MS-DIAL\Lipids.lbm2'

[library]
# library_load(ion_mode=...) が読む参照ライブラリ（.msp）。極性ごとに 1 つ。
# msp_positive = 'D:\library\pos.msp'
# msp_negative = 'D:\library\neg.msp'
# pipeline の library_mode="msp_then_lbm" が研究室 MSP の補いに使う脂質ライブラリ（.lbm2）。
# このモードはここだけを読む（[msdial] lbm・メソッドの宣言・実行体のフォルダは見ない）。
# 環境変数 MSDIAL_LIBRARY_LBM が設定されていればそちらが優先される。
# lbm = 'D:\library\lipids.lbm2'

[mslipidmapper]
# 研究室サーバの MSLipidMapper REST API。書けば pathway_project / pathway_plot はまずここを使い、
# 未到達・404・ジョブ失敗などで使えなければ下の rscript（ローカルの R）へ回す。
# 書かない（または空文字）ならローカルの R だけを使う。中間 mzTab-M はサーバへ送られる。
# mslipidmapper_api_url = 'http://10.0.0.1:8000'
# サーバが認証を求めるときだけ（環境変数 MSLIPIDMAPPER_API_TOKEN でもよい）。
# api_token = '...'
# pathway_project / pathway_plot が呼ぶ Rscript（R 4.6 系）。パッケージは R 本体ではなく
# リポジトリの renv 環境 r/ に入る。初回だけ: Rscript r/setup.R
# rscript = 'C:\Program Files\R\R-4.6.0\bin\Rscript.exe'
# pathway_plot の PDF 描画に使うヘッドレス Chromium（Chrome / Edge）。任意:
# 書かなければ Edge / Chrome の標準の置き場所から自動で探す。
# browser = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'

[quant]
# 定量の工程（任意）。環境変数はなく、ここだけで指す。書き方は docs/quant-rules-plugin.md。
# 規則プラグイン（パッケージ msdial_rules のフォルダ）。書かなければ定量の 4 ツールは
# quant_rules_unavailable を返す。
# rules = 'D:\tools\msdial-rules\msdial_rules'
# 付加体の採用表（CSV）。任意。
# adducts = 'D:\tables\adduct-selection.csv'
