<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alignment curation</title>
<style>
:root { --bg:#fbfbfa; --fg:#1f2328; --muted:#6a737d; --card:#ffffff; --line:#d8dde3;
        --ok:#2e7d32; --suspect:#b26a00; --wrong:#c62828; --meas:#2471a3; --ref:#c0392b; --match:#27ae60; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16181b; --fg:#e6e6e6; --muted:#9aa0a6; --card:#1f2226; --line:#33383e;
          --ok:#66bb6a; --suspect:#ffb74d; --wrong:#ef5350; --meas:#5dade2; --ref:#ec7063; --match:#58d68d; }
}
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line);
         padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
header h1 { font-size:15px; margin:0 12px 0 0; min-width:0; overflow-wrap:anywhere; }
select, button, input[type=text] { font:inherit; color:inherit; background:var(--card);
         border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
button.primary { background:var(--meas); color:#fff; border-color:var(--meas); }
button.quiet { opacity:.7; }
#result { color:var(--muted); overflow-wrap:anywhere; }
#status { color:var(--muted); }
main { padding:12px 16px 40px; }
.warn { border-left:3px solid var(--suspect); padding:6px 10px; margin:6px 0; background:var(--card); }
#trends { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap:12px; margin-bottom:16px; }
#grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; }
.card.flag-wrong { outline:2px solid var(--wrong); }
.card.flag-suspect { outline:2px solid var(--suspect); }
.card.flag-confirmed { outline:2px solid var(--ok); }
#grid .card { position:relative; }
#grid .card h2 { padding-right:96px; }
.card .confirm { position:absolute; top:8px; right:10px; font-size:12px; display:flex; gap:4px; align-items:center; }
/* 自動判別 likely_wrong は赤の破線（未確認）。人が「間違い」を付けると実線になる。 */
.card.verdict-likely_wrong { border:2px dashed var(--wrong); }
.card.verdict-likely_wrong.flag-wrong { border-style:solid; }
.card h2 { font-size:14px; margin:0 0 4px; word-break:break-word; }
.meta { color:var(--muted); font-size:12px; }
.badge { display:inline-block; border-radius:4px; padding:0 6px; font-size:12px; color:#fff; }
.badge.ok { background:var(--ok); } .badge.suspect { background:var(--suspect); } .badge.likely_wrong { background:var(--wrong); }
canvas { width:100%; height:110px; display:block; margin-top:6px; }
.flags { display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
.flags input[type=text] { flex:1 1 120px; min-width:0; }
textarea { width:100%; height:80px; font:12px monospace; }
.card canvas, #trends canvas { cursor:pointer; }
.card.highlight { box-shadow:0 0 0 3px var(--meas); transition:box-shadow .2s; }
#zoom { width:min(960px, calc(100vw - 32px)); max-width:100%; max-height:calc(100vh - 32px);
        padding:12px; border:1px solid var(--line); border-radius:8px;
        background:var(--card); color:var(--fg); }
#zoom::backdrop { background:rgba(0,0,0,.5); }
#zoom .zoom-head { display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
#zoom h2 { font-size:15px; margin:0; min-width:0; overflow-wrap:anywhere; }
#zoom canvas { height:min(280px, 30vh); cursor:default; }
.exclude { display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap; }
#trends .card { cursor:pointer; }
#trends .card.trend-selected { box-shadow:0 0 0 3px var(--meas); }
#trends .plot { width:100%; height:200px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Alignment curation</h1>
  <label>Class <select id="f-class"><option value="">All</option></select></label>
  <label>Verdict <select id="f-verdict"><option value="">All</option><option value="ok">ok</option><option value="suspect">suspect</option><option value="likely_wrong">likely_wrong</option><option value="flagged">suspect or worse</option></select></label>
  <label>Flag <select id="f-flag"><option value="">All</option><option value="correct">Correct</option><option value="confirmed">Confirmed</option><option value="suspect">Suspect</option><option value="wrong">Wrong</option><option value="set">Flagged</option></select></label>
  <span class="exclude">Exclude <label><input type="checkbox" id="x-low_score"> low score</label>
    <label><input type="checkbox" id="x-msms_absent"> no MS/MS</label></span>
  <button id="send" class="primary" hidden>Send</button>
  <button id="submit" class="primary" hidden>Submit</button>
  <button id="finish" hidden>Finish</button>
  <button id="copy">Copy submission text</button>
  <span id="status"></span>
  <span id="result"></span>
</header>
<main>
  <div id="warnings"></div>
  <section id="trends"></section>
  <section id="grid"></section>
  <textarea id="fallback" hidden readonly></textarea>
</main>
<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="zoom-head"><h2 id="zoom-title"></h2><button id="zoom-close" type="button">Close (Esc)</button></div>
  <div class="meta" id="zoom-meta"></div>
  <canvas id="zoom-eic"></canvas>
  <canvas id="zoom-ms1"></canvas>
  <canvas id="zoom-mirror"></canvas>
</dialog>
<script>
const EMBEDDED = /*__CURATION_DATA__*/null;
const PREFIX = "__SUBMISSION_PREFIX__";
let REVIEW = EMBEDDED;
const edits = new Map();   // spot_id -> {flag, note}

// --- presets (pure) ---
// 自動判別 likely_wrong・照合スコア不足（low_score）・MS/MS なし（msms_absent）は「間違い」を
// 初期選択にする（未送信の変更に入れる。ユーザー決定 2026-09-29 / 2026-10-09）。記録済みの
// フラグがあるもの・人が明示的に取り消したもの（flag_cleared）には掛けない。メモ欄の既定値は
// 記録済みのメモ、無ければ判定根拠（auto_note。MS/MS なしは判定理由ではなく情報なので書き足す）。
function presetCause(spot) {
  if (spot.verdict === "likely_wrong") return "likely_wrong";
  if ((spot.reasons || []).some(r => r.split(":")[0] === "low_score")) return "low_score";
  if ((spot.info || []).includes("msms_absent")) return "msms_absent";
  return null;
}
function isPresetTarget(spot) { return !!presetCause(spot) && !spot.flag && !spot.flag_cleared && !spot.confirmed; }
function presetNote(spot) {
  const parts = spot.auto_note ? [spot.auto_note] : [];
  if ((spot.info || []).includes("msms_absent")) parts.push(parts.length ? "no MS/MS" : "Auto: no MS/MS");
  return parts.join(" / ");
}
function presetEdit(spot) { return {flag: "wrong", note: presetNote(spot), preset: true}; }
function defaultNote(spot) { return spot.flag_note || presetNote(spot); }
// --- end presets ---

// --- status filters (pure) ---
// 判定（自動）は ok / suspect / likely_wrong を個別に、"flagged" は suspect 以上。
// フラグ（人）は Correct（無印か confirmed）/ Confirmed / Suspect / Wrong を個別に、"set" は Suspect か Wrong。
function matchesVerdictFilter(spot, value) {
  if (!value) return true;
  if (value === "flagged") return spot.verdict !== "ok";
  return spot.verdict === value;
}
function matchesFlagFilter(flag, value) {
  if (!value) return true;
  if (value === "set") return flag === "suspect" || flag === "wrong";
  if (value === "correct") return !flag || flag === "confirmed";
  return flag === value;
}
// --- end status filters ---

// --- exclusion (pure) ---
// 絞り込みとは別の「除外」。チェックした項目に当たるスポットを一覧からも傾向の点からも隠す。
// low score = 理由 low_score、MS/MS なし = 情報 msms_absent（「間違い」の初期選択と同じ定義）。
// 隠しても未送信の変更（初期選択の「間違い」）は残り、送信される。
const EXCLUSION_ITEMS = ["low_score", "msms_absent"];
function exclusionCauses(spot) {
  const causes = [];
  if ((spot.reasons || []).some(r => r.split(":")[0] === "low_score")) causes.push("low_score");
  if ((spot.info || []).includes("msms_absent")) causes.push("msms_absent");
  return causes;
}
function isExcluded(spot, excluded) { return exclusionCauses(spot).some(c => excluded.includes(c)); }
// --- end exclusion ---

// --- confirmed (pure) ---
// Confirmed（カード右上のチェック）は判断の 1 つで、Suspect / Wrong と排他（ユーザー決定 2026-10-09）。
// 元の状態は記録のフラグ、無ければ spot.confirmed（_tags.xml の Confirmed。GUI で付けたものも）。
// 外すと Correct（送信では clear。Confirmed タグも外れる）。
function originalFlag(spot) { return spot.flag || (spot.confirmed ? "confirmed" : ""); }
function flagControls(flag) {
  return {radio: flag === "suspect" || flag === "wrong" ? flag : "", confirmed: flag === "confirmed"};
}
// --- end confirmed ---

function currentFlag(spot) { return edits.has(spot.spot_id) ? edits.get(spot.spot_id).flag : originalFlag(spot); }

/*__VIEWER_COMMON__*/

// 傾向カードの軸は x = RT、y = m/z（ユーザー決定 2026-10-09）。範囲はクラスの全点で決め、
// 絞り込みで点が減っても軸は動かさない（見比べやすさのため）。直線は RT = slope·m/z + intercept。
function trendExtent(ontology) {
  const all = REVIEW.spots.filter(s => s.ontology === ontology && s.composition);
  if (!all.length) return null;
  const xs = all.map(s => s.rt), ys = all.map(s => s.mz);
  return {x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys)};
}

function drawTrend(prepare, ontology, spots) {
  const {ctx, w, h} = prepare(); const pts = spots.filter(s => s.ontology === ontology && s.composition);
  const ext = trendExtent(ontology); prepare.canvas._points = []; if (!ext) return;
  const {x0, x1, y0, y1} = ext;
  const px = x => 24 + (x - x0) / ((x1 - x0) || 1) * (w - 32), py = y => h - 14 - (y - y0) / ((y1 - y0) || 1) * (h - 24);
  const palette = ["#2471a3", "#c0392b", "#27ae60", "#8e44ad", "#d35400", "#16a085", "#7f8c8d"];
  const groups = ((REVIEW.trend.groups || {})[ontology]) || {};
  // slope*x+intercept は RT レンジの外まで伸びうるので、プロット矩形（px/py が写す領域）で
  // クリップする。散布点・軸ラベルはこの矩形の内側にしか描かないのでクリップの外(save/restore
  // の外)でよい。
  ctx.save();
  ctx.beginPath();
  ctx.rect(24, 10, w - 32, h - 24);
  ctx.clip();
  for (const [db, g] of Object.entries(groups)) {
    if (g.slope === null) continue; const color = palette[Number(db) % palette.length];
    ctx.strokeStyle = color; ctx.globalAlpha = g.r2 !== null && g.r2 < 0.7 ? 0.35 : 0.9;
    ctx.beginPath(); ctx.moveTo(px(g.slope * y0 + g.intercept), py(y0)); ctx.lineTo(px(g.slope * y1 + g.intercept), py(y1)); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  prepare.canvas._points = pts.map(s => ({x: px(s.rt), y: py(s.mz), spot_id: s.spot_id}));
  for (const s of pts) { const db = s.composition[1]; ctx.fillStyle = palette[db % palette.length];
    ctx.beginPath(); ctx.arc(px(s.rt), py(s.mz), s.trend && s.trend.outlier ? 5 : 3, 0, 7); ctx.fill();
    if (s.trend && s.trend.outlier) { ctx.strokeStyle = css("--wrong"); ctx.stroke(); } }
  ctx.fillStyle = css("--muted"); ctx.font = "10px system-ui";
  ctx.fillText("RT →", w - 34, h - 2); ctx.fillText("m/z", 2, 10);
}

// --- trend selection (pure) ---
// 傾向カードのクリックでクラスの絞り込みを切り替える。いま選ばれているクラス（下位項目
// "<クラス>\tlikely_wrong" も同じクラスとみなす）をもう一度押すと解除。
function classOfFilter(value) {
  return value && value.endsWith("\tlikely_wrong") ? value.slice(0, -"\tlikely_wrong".length) : (value || "");
}
function nextClassFilter(current, ontology) { return classOfFilter(current) === ontology ? "" : ontology; }
// --- end trend selection ---

// --- trend click (pure) ---
// 傾向カードのクリックでクラスを切り替えてよいか。点のクリック（plotly_click）の直後と、
// 同じ押下から重ねて届く click（Plotly は覆いの後に click を再送する）は切り替えない。
const CARD_CLICK_GUARD_MS = 400;
function cardClickToggles(now, guard) {
  return now >= guard.suppressUntil && now - guard.lastToggleAt >= CARD_CLICK_GUARD_MS;
}
// --- end trend click ---

// 点のクリック・hover を点の上（半径 + 数 px）に限る。Plotly 既定の 20 px では密な図のどこを
// 押しても近くの点が拾われ、カードのクリックが別スポットへの移動になった（実地確認 2026-10-09）。
const POINT_HIT_PX = 6;

// Plotly は cdnjs から読む（固定版）。オフラインや MCP Apps の CSP で届かなければ null に
// 解決し、従来の canvas 描画（drawTrend）に落とす。
const PLOTLY_URL = "https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js";
const PLOTLY_TIMEOUT_MS = 10000;
let plotlyPromise = null;
function plotlyReady() {
  if (!plotlyPromise) plotlyPromise = new Promise(resolve => {
    if (window.Plotly) { resolve(window.Plotly); return; }
    const script = document.createElement("script");
    const timer = setTimeout(() => resolve(null), PLOTLY_TIMEOUT_MS);
    script.src = PLOTLY_URL; script.async = true;
    script.onload = () => { clearTimeout(timer); resolve(window.Plotly || null); };
    script.onerror = () => { clearTimeout(timer); resolve(null); };
    document.head.appendChild(script);
  });
  return plotlyPromise;
}

const TREND_PALETTE = ["#2471a3", "#c0392b", "#27ae60", "#8e44ad", "#d35400", "#16a085", "#7f8c8d"];

function trendTraces(ontology, spots) {
  const ext = trendExtent(ontology); if (!ext) return {traces: [], ext: null};
  const {y0, y1} = ext;
  const groups = ((REVIEW.trend.groups || {})[ontology]) || {};
  const traces = [];
  // 回帰直線（DB ごと。RT = slope·m/z + intercept を x = RT, y = m/z に描く）。当てはまりの悪い群は薄く。
  for (const [db, g] of Object.entries(groups)) {
    if (g.slope === null) continue;
    traces.push({x: [g.slope * y0 + g.intercept, g.slope * y1 + g.intercept], y: [y0, y1], mode: "lines",
      line: {color: TREND_PALETTE[Number(db) % TREND_PALETTE.length], width: 1.5},
      opacity: g.r2 !== null && g.r2 < 0.7 ? 0.35 : 0.9, hoverinfo: "skip", showlegend: false});
  }
  const byDb = new Map();
  for (const s of spots.filter(s => s.ontology === ontology && s.composition)) {
    const db = s.composition[1]; if (!byDb.has(db)) byDb.set(db, []); byDb.get(db).push(s);
  }
  const wrong = css("--wrong");
  for (const [db, members] of [...byDb.entries()].sort((a, b) => a[0] - b[0])) {
    const outlier = members.map(s => !!(s.trend && s.trend.outlier));
    traces.push({x: members.map(s => s.rt), y: members.map(s => s.mz), mode: "markers", type: "scatter",
      name: `DB ${db}`, customdata: members.map(s => [s.spot_id, s.name || ""]),
      hovertemplate: `#%{customdata[0]} %{customdata[1]}<br>DB ${db} / RT %{x:.2f} / m/z %{y:.4f}<extra></extra>`,
      marker: {color: TREND_PALETTE[db % TREND_PALETTE.length], size: outlier.map(o => o ? 10 : 6),
               line: {color: outlier.map(o => o ? wrong : "rgba(0,0,0,0)"), width: 2}}});
  }
  return {traces, ext};
}

function plotTrend(Plotly, box, ontology, spots, onPoint) {
  const {traces, ext} = trendTraces(ontology, spots); if (!ext) return;
  const {x0, x1, y0, y1} = ext;
  const padX = (x1 - x0) * 0.04 || 0.1, padY = (y1 - y0) * 0.08 || 1;
  const axis = {gridcolor: css("--line"), zeroline: false, tickfont: {size: 10}};
  const layout = {
    margin: {l: 48, r: 8, t: 4, b: 30}, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: {color: css("--fg"), size: 11}, dragmode: false, hovermode: "closest", hoverdistance: POINT_HIT_PX,
    showlegend: false,   // DB は色と hover で示す（凡例は DB が多いクラスで描画域を潰す）
    xaxis: {...axis, title: {text: "RT (min)", font: {size: 10}, standoff: 4}, range: [x0 - padX, x1 + padX]},
    yaxis: {...axis, title: {text: "m/z", font: {size: 10}, standoff: 4}, range: [y0 - padY, y1 + padY]},
  };
  if (box._plotted) { Plotly.react(box, traces, layout); return; }   // 絞り込みの変更: 点だけ差し替える
  Plotly.newPlot(box, traces, layout, {displayModeBar: false, responsive: true});
  box._plotted = true;
  box.on("plotly_click", event => {
    const p = event && event.points && event.points.find(q => q.customdata);
    if (p) onPoint(p.customdata[0]);
  });
}

// --- isotope labels (pure) ---
// MS1 同位体の棒の上の値: 実測の相対強度 %（横に絶対強度）/ 理論の相対強度 %（ユーザー決定 2026-10-09）。
// 絶対強度は 1000 未満なら整数、以上は有効 2 桁の指数表記（5340 → 5.3e3）で、カードの幅に収める。
function formatAbsolute(value) {
  if (typeof value !== "number" || !isFinite(value)) return "–";
  return value < 1000 ? String(Math.round(value)) : value.toExponential(1).replace("e+", "e");
}
function isotopeLabel(rel, abs, theory) {
  const pct = v => (typeof v === "number" ? v.toFixed(0) + "%" : "–");
  const measured = typeof rel === "number" ? pct(rel) + (typeof abs === "number" ? ` (${formatAbsolute(abs)})` : "") : "–";
  return {measured, theory: pct(theory)};
}
// --- end isotope labels ---

// MS1: 代表試料の同位体（.arf2 の IsotopicPeaks）を実測、組成式＋アダクトからの計算値を理論として
// M, M+1, M+2 ごとに横並びの棒で描く（M = 100 %）。棒の上は「実測 % (絶対強度) / 理論 %」。
// 1 行で入らない幅（携帯など）では「(絶対強度)」を 1 段上に分けて描く。
function drawIsotopes(prepare, spot) {
  const {ctx, w, h} = prepare(); const iso = spot.isotopes || {};
  const measured = iso.measured || [], theory = (iso.theoretical || {}).relative || [];
  ctx.font = "10px system-ui"; ctx.fillStyle = css("--muted");
  if (!measured.length && !theory.length) { ctx.font = "12px system-ui"; ctx.fillText("No MS1 isotopes", 8, h / 2); return; }
  const n = Math.max(measured.length, theory.length), left = 26, bottom = h - 14;
  const slot = (w - left - 4) / n, bar = Math.min(18, slot / 3);
  const labels = [...Array(n).keys()].map(k =>
    isotopeLabel(measured[k] ? measured[k][1] : null, measured[k] ? measured[k][2] : null, theory[k] ?? null));
  // 横に並べる。入らなければ文字を 10 → 9 px に下げ、それでも入らなければ 2 段に分ける。
  const fits = font => { ctx.font = font; return labels.every(l => ctx.measureText(`${l.measured} / ${l.theory}`).width <= slot - 4); };
  const labelFont = fits("10px system-ui") ? "10px system-ui" : "9px system-ui";
  const wrap = !fits(labelFont); ctx.font = "10px system-ui";
  const top = wrap ? 37 : 26;
  const py = v => bottom - Math.min(v, 100) / 100 * (bottom - top);
  ctx.strokeStyle = css("--line"); ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(left, bottom); ctx.lineTo(w, bottom); ctx.stroke();
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (const pct of [0, 50, 100]) ctx.fillText(String(pct), left - 4, py(pct));
  ctx.textAlign = "center";
  for (let k = 0; k < n; k++) {
    const cx = left + slot * (k + 0.5);
    const m = measured[k] ? measured[k][1] : null, t = theory[k] ?? null;
    if (m !== null) { ctx.fillStyle = css("--meas"); ctx.fillRect(cx - bar - 1, py(m), bar, bottom - py(m)); }
    if (t !== null) { ctx.strokeStyle = css("--ref"); ctx.lineWidth = 1.5; ctx.strokeRect(cx + 1, py(t), bar, bottom - py(t)); ctx.lineWidth = 1; }
    ctx.fillStyle = css("--fg"); ctx.textBaseline = "bottom"; ctx.font = labelFont;
    const y = Math.min(py(m ?? 0), py(t ?? 0)) - 1, l = labels[k];
    if (!wrap) ctx.fillText(`${l.measured} / ${l.theory}`, cx, y);
    else {
      const split = l.measured.indexOf(" (");
      const rel = split < 0 ? l.measured : l.measured.slice(0, split), abs = split < 0 ? "" : l.measured.slice(split + 1);
      ctx.fillText(`${rel} / ${l.theory}`, cx, y);
      if (abs) { ctx.fillStyle = css("--muted"); ctx.fillText(abs, cx, y - 11); }
    }
    ctx.fillStyle = css("--muted"); ctx.textBaseline = "top"; ctx.font = "10px system-ui";
    ctx.fillText(k ? `M+${k}` : "M" + (measured[0] ? ` ${measured[0][0].toFixed(4)}` : ""), cx, bottom + 2);
  }
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillStyle = css("--muted");
  ctx.fillText("MS1 isotopes % (abs.)  ■ measured  □ theory" + (iso.theoretical && iso.theoretical.basis === "formula" ? " (neutral formula)" : ""), left + 4, 0);
}

function spotCard(spot) {
  const card = el("article", {class: "card " + "verdict-" + spot.verdict, id: "spot-" + spot.spot_id});
  card.appendChild(el("h2", {}, spot.name));
  const badge = el("span", {class: "badge " + spot.verdict}, spot.verdict);
  const meta = el("div", {class: "meta"});
  meta.append(badge, " ", `#${spot.spot_id} ${spot.adduct || ""} m/z ${fixed(spot.mz, 4)} RT ${fixed(spot.rt, 2)}`);
  card.appendChild(meta);
  const w = spot.match && spot.match.squared_weighted_dot_product >= 0 ? Math.sqrt(spot.match.squared_weighted_dot_product).toFixed(2) : "–";
  card.appendChild(el("div", {class: "meta"},
    `Δppm ${spot.ppm ?? "–"} / ΔRT ${spot.drt ?? "–"} / wdot ${w} / EIC ${spot.eic_shape.good_fraction ?? "–"}`));
  if (spot.reasons.length || spot.info.length)
    card.appendChild(el("div", {class: "meta"}, [...spot.reasons, ...spot.info.map(r => "(" + r + ")")].join(", ")));
  if (spot.decision) card.appendChild(el("div", {class: "meta"}, spot.decision.flag === "assign"
    ? `Recorded: candidate adopted (${spot.decision.name})` : `Recorded: another ion of #${spot.decision.of}`));
  const eic = canvasFor(card), ms1 = canvasFor(card), mirror = canvasFor(card);
  for (const prepare of [eic, ms1, mirror]) prepare.canvas.addEventListener("click", () => openZoom(spot));
  const flagsRow = el("div", {class: "flags"});
  const radios = {};
  const confirmId = `c-${spot.spot_id}`;
  const confirmBox = el("input", {type: "checkbox", id: confirmId});
  const confirmLabel = el("label", {class: "confirm", for: confirmId, title: "Mark the annotation as confirmed"});
  confirmLabel.append(confirmBox, "Confirmed"); card.appendChild(confirmLabel);
  const syncControls = () => {
    const c = flagControls(currentFlag(spot));
    for (const [value, radio] of Object.entries(radios)) radio.checked = c.radio === value;
    confirmBox.checked = c.confirmed;
  };
  confirmBox.addEventListener("change", () => {
    // 自動の判定根拠（Wrong の理由）を Confirmed のメモに残さない。人が書き換えたメモは残す。
    if (confirmBox.checked && note.value === presetNote(spot)) note.value = "";
    setFlag(spot, confirmBox.checked ? "confirmed" : "", note.value, card); syncControls();
  });
  for (const [value, label] of [["", "Correct"], ["suspect", "Suspect"], ["wrong", "Wrong"]]) {
    const id = `f-${spot.spot_id}-${value || "none"}`;
    const radio = el("input", {type: "radio", name: "flag-" + spot.spot_id, id, value});
    radios[value] = radio;
    radio.addEventListener("change", () => { setFlag(spot, value, note.value, card); syncControls(); });
    const lab = el("label", {for: id}); lab.append(radio, " " + label); flagsRow.appendChild(lab);
  }
  const note = el("input", {type: "text", placeholder: "Note"});
  note.value = edits.has(spot.spot_id) ? (edits.get(spot.spot_id).note || "") : defaultNote(spot);
  note.addEventListener("change", () => setFlag(spot, currentFlag(spot), note.value, card));
  flagsRow.appendChild(note); card.appendChild(flagsRow); syncControls();
  // プリセットのまま（未送信・人が触っていない）は破線のまま。送信して記録されるか、人が選び直すと実線。
  if ((edits.get(spot.spot_id) || {}).preset) card.classList.add("flag-preset");
  else card.classList.toggle("flag-" + currentFlag(spot), !!currentFlag(spot));
  card._draw = () => { drawEic(eic, spot); drawIsotopes(ms1, spot); drawMirror(mirror, spot); };
  return card;
}

function setFlag(spot, flag, note, card) {
  const original = originalFlag(spot);
  // プリセット対象を Correct に戻したら明示の取消として送る（次のレビューで掛け直さないため）。
  // GUI で付いていた Confirmed（記録なし）を外すときも clear を送ってタグを外す。
  const explicitClear = flag === "" && (isPresetTarget(spot) || original !== "");
  if (!explicitClear && flag === original && (flag === "" || (note || "") === (spot.flag_note || "")))
    edits.delete(spot.spot_id);
  else edits.set(spot.spot_id, {flag, note});
  card.classList.remove("flag-wrong", "flag-suspect", "flag-confirmed", "flag-preset"); if (flag) card.classList.add("flag-" + flag);
  document.getElementById("status").textContent = countsText();
}

// --- recorded (pure) ---
// 送信が記録されたら、未送信の変更をスポットへ写す（MCP Apps の Send とビューアの Submit で共通）。
function applyRecorded(spots, edits) {
  for (const [spotId, e] of edits) {
    const spot = spots.find(s => s.spot_id === spotId); if (!spot) continue;
    spot.flag = e.flag || null; spot.flag_note = e.flag ? (e.note || "") : null; spot.flag_cleared = !e.flag;
    spot.confirmed = e.flag === "confirmed";
  }
}
// 送信中に変わった変更は未送信のまま残す: 送った内容（flag と note）と今も同じ項目だけを消す。
function clearSent(edits, sent) {
  for (const [spotId, e] of sent) {
    const cur = edits.get(spotId);
    if (cur && cur.flag === e.flag && cur.note === e.note) edits.delete(spotId);
  }
}
// --- end recorded ---

function submission() {
  const flags = [...edits.entries()].map(([spot_id, e]) => ({spot_id, flag: e.flag || "clear", note: e.note || ""}));
  return {review_id: REVIEW.review_id, arf2_path: REVIEW.arf2_path, flags};
}

const observer = new IntersectionObserver(entries => { for (const e of entries)
  if (e.isIntersecting && e.target._draw) { e.target._draw(); observer.unobserve(e.target); } }, {rootMargin: "200px"});

let presetCount = 0;   // start() で「間違い」に初期選択した件数
let presetCauses = {};  // その内訳（presetCause ごと）
const PRESET_CAUSE_LABEL = {likely_wrong: "likely_wrong", low_score: "low score", msms_absent: "no MS/MS"};

function countsText() {
  const counts = `ok ${REVIEW.counts.ok} / suspect ${REVIEW.counts.suspect} / likely_wrong ${REVIEW.counts.likely_wrong}`;
  if (!edits.size) return counts + exclusionText();
  const causes = Object.entries(presetCauses).map(([c, n]) => `${PRESET_CAUSE_LABEL[c] || c} ${n}`).join(", ");
  return counts + ` — ${edits.size} unsent change(s)` + (presetCount ? ` (${presetCount} preset to Wrong: ${causes})` : "")
    + exclusionText();
}

function exclusionText() {
  const excluded = currentExclusions();
  return excluded.length ? ` — ${REVIEW.spots.filter(s => isExcluded(s, excluded)).length} excluded` : "";
}

// requestAnimationFrame が無い環境(古い WebView 等)向けのフォールバック。
const scheduleChunk = typeof requestAnimationFrame === "function"
  ? cb => requestAnimationFrame(cb)
  : cb => setTimeout(cb, 0);

const RENDER_CHUNK_SIZE = 100;
let renderGeneration = 0;   // フィルタ変更などで新しい render() が割り込んだら古い方を打ち切る

// --- class filter (pure) ---
// クラスの選択肢。各クラスの下に「自動判別: 間違い」の下位項目（そのクラスに likely_wrong が
// あるときだけ）、先頭に全クラス横断の項目（1 件以上あるときだけ）を置く。値は
// "<クラス>" / "<クラス>	likely_wrong" / "	likely_wrong"（タブはクラス名に現れない）。
const LIKELY_WRONG_SUFFIX = "	likely_wrong";

function classFilterOptions(spots) {
  const total = new Map(), wrong = new Map();
  let wrongAll = 0;
  for (const s of spots) {
    const isWrong = s.verdict === "likely_wrong";
    if (isWrong) wrongAll++;
    if (!s.ontology) continue;
    total.set(s.ontology, (total.get(s.ontology) || 0) + 1);
    if (isWrong) wrong.set(s.ontology, (wrong.get(s.ontology) || 0) + 1);
  }
  const options = [{value: "", label: "All"}];
  if (wrongAll) options.push({value: LIKELY_WRONG_SUFFIX, label: `⚠ likely_wrong (all classes, ${wrongAll})`});
  for (const c of [...total.keys()].sort()) {
    options.push({value: c, label: `${c} (${total.get(c)})`});
    if (wrong.get(c)) options.push({value: c + LIKELY_WRONG_SUFFIX, label: `└ ${c} › likely_wrong (${wrong.get(c)})`});
  }
  return options;
}

function matchesClassFilter(spot, value) {
  if (!value) return true;
  const wrongOnly = value.endsWith(LIKELY_WRONG_SUFFIX);
  const cls = wrongOnly ? value.slice(0, -LIKELY_WRONG_SUFFIX.length) : value;
  if (wrongOnly && spot.verdict !== "likely_wrong") return false;
  return !cls || spot.ontology === cls;
}
// --- end class filter ---

// --- trend points (pure) ---
// 傾向カードの点は一覧と同じ絞り込み（判定・フラグ・除外、クラスの「› likely_wrong」下位項目）に
// 従う。クラスの選択そのものは他のカードの点を消さない（カードの強調だけ。ユーザー決定 2026-10-09）。
// f = {classValue, verdict, flag, excluded}。flag は未送信の変更を含む現在のフラグ。
function trendPointVisible(spot, flag, f) {
  if ((f.classValue || "").endsWith(LIKELY_WRONG_SUFFIX) && spot.verdict !== "likely_wrong") return false;
  return matchesVerdictFilter(spot, f.verdict) && matchesFlagFilter(flag, f.flag) && !isExcluded(spot, f.excluded);
}
// --- end trend points ---

function passesFilters(spot) {
  const cls = document.getElementById("f-class").value, ver = document.getElementById("f-verdict").value,
        flg = document.getElementById("f-flag").value;
  return matchesClassFilter(spot, cls) && matchesVerdictFilter(spot, ver) && matchesFlagFilter(currentFlag(spot), flg)
    && !isExcluded(spot, currentExclusions());
}

function currentExclusions() { return EXCLUSION_ITEMS.filter(c => document.getElementById("x-" + c).checked); }

function resetFilters(keepClass) {
  for (const id of keepClass ? ["f-verdict", "f-flag"] : ["f-class", "f-verdict", "f-flag"])
    document.getElementById(id).value = "";
}

function render() {
  const generation = ++renderGeneration;
  syncTrendSelection(); refreshTrends();
  const grid = document.getElementById("grid"); grid.textContent = "";
  const matched = REVIEW.spots.filter(passesFilters);
  const status = document.getElementById("status");
  let i = 0;

  function buildChunk() {
    if (generation !== renderGeneration) return;   // 新しい render() 呼び出しに割り込まれた
    const frag = document.createDocumentFragment();
    const end = Math.min(i + RENDER_CHUNK_SIZE, matched.length);
    for (; i < end; i++) {
      const card = spotCard(matched[i]);
      frag.appendChild(card);
      observer.observe(card);
    }
    grid.appendChild(frag);
    if (i < matched.length) {
      status.textContent = `Building… ${i}/${matched.length}`;
      scheduleChunk(buildChunk);
    } else {
      status.textContent = countsText();
    }
  }
  buildChunk();
}

const HIT_RADIUS = 6;   // 傾向パネルの点をクリックとみなす半径 [CSS px]

function nearestPoint(canvas, event) {
  const rect = canvas.getBoundingClientRect(), x = event.clientX - rect.left, y = event.clientY - rect.top;
  let best = null, bestD = HIT_RADIUS * HIT_RADIUS;
  for (const p of canvas._points || []) {
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d <= bestD) { best = p; bestD = d; }
  }
  return best;
}

function jumpToSpot(spotId) {
  const spot = REVIEW.spots.find(s => s.spot_id === spotId); if (!spot) return;
  // 絞り込みで隠れていれば外す。クラスはスポットが合っていれば残す（傾向カードから来たとき）。
  if (!passesFilters(spot)) { resetFilters(true); if (!passesFilters(spot)) resetFilters(); render(); }
  // render() はチャンクで組み立てるので、カードができるまで次のフレームで探し直す。
  const generation = renderGeneration;
  const attempt = tries => {
    const card = document.getElementById("spot-" + spotId);
    if (card) {
      card.scrollIntoView({behavior: "smooth", block: "center"});
      card.classList.add("highlight"); setTimeout(() => card.classList.remove("highlight"), 1600);
    } else if (tries < 1000 && generation === renderGeneration) scheduleChunk(() => attempt(tries + 1));
  };
  attempt(0);
}

function setClassFilter(value) {
  const select = document.getElementById("f-class");
  if (select.value === value) return false;
  select.value = value; render(); return true;
}

function syncTrendSelection() {
  const selected = classOfFilter(document.getElementById("f-class").value);
  for (const card of document.querySelectorAll("#trends .card"))
    card.classList.toggle("trend-selected", !!selected && card.dataset.ontology === selected);
}

// 点のクリック（カーソルが点の上にあるとき）→ そのクラスを選んでスポットのカードへ。
// カードのそれ以外の場所（見出し・図の空白・余白）→ クラスの選択を切り替え。
function goToSpot(ontology, spotId) {
  if (classOfFilter(document.getElementById("f-class").value) !== ontology) setClassFilter(ontology);
  jumpToSpot(spotId);
}

function currentTrendFilter() {
  return {classValue: document.getElementById("f-class").value, verdict: document.getElementById("f-verdict").value,
          flag: document.getElementById("f-flag").value, excluded: currentExclusions()};
}

function visibleTrendSpots() {
  const f = currentTrendFilter();
  return REVIEW.spots.filter(s => trendPointVisible(s, currentFlag(s), f));
}

// 描いた傾向カードの点を今の絞り込みに合わせて描き直す（まだ描いていないカードは描くときに合わせる）。
function refreshTrends() {
  const spots = visibleTrendSpots();
  for (const card of document.querySelectorAll("#trends .card")) if (card._redraw) card._redraw(spots);
}

function renderTrends() {
  const box = document.getElementById("trends"); box.textContent = "";
  for (const [ontology, info] of Object.entries(REVIEW.trend.classes || {})) {
    const card = el("article", {class: "card", "data-ontology": ontology,
                                title: "Click to filter to this class (click a point to go to its spot)"});
    card.appendChild(el("h2", {}, `${ontology} (n=${info.n}, R²=${info.r2 ?? "–"})`));
    box.appendChild(card);
    const guard = {suppressUntil: 0, lastToggleAt: -Infinity};
    const onPoint = spotId => { guard.suppressUntil = performance.now() + CARD_CLICK_GUARD_MS; goToSpot(ontology, spotId); };
    card.addEventListener("click", event => {
      if (card._canvas) { const hit = nearestPoint(card._canvas, event); if (hit) { onPoint(hit.spot_id); return; } }
      const now = performance.now();
      if (!cardClickToggles(now, guard)) return;
      guard.lastToggleAt = now;
      setClassFilter(nextClassFilter(document.getElementById("f-class").value, ontology));
    });
    card._draw = () => plotlyReady().then(Plotly => {
      if (Plotly) {
        const plot = el("div", {class: "plot"}); card.appendChild(plot);
        card._redraw = spots => plotTrend(Plotly, plot, ontology, spots, onPoint);
      } else {
        const prepare = canvasFor(card); card._canvas = prepare.canvas;
        card._redraw = spots => drawTrend(prepare, ontology, spots);
      }
      card._redraw(visibleTrendSpots());
    });
    observer.observe(card);
  }
  syncTrendSelection();
}

const zoomEic = preparerFor(document.getElementById("zoom-eic"));
const zoomMs1 = preparerFor(document.getElementById("zoom-ms1"));
const zoomMirror = preparerFor(document.getElementById("zoom-mirror"));

function closeZoom() {
  const dialog = document.getElementById("zoom");
  if (typeof dialog.close === "function") dialog.close(); else dialog.removeAttribute("open");
}

function openZoom(spot) {
  const dialog = document.getElementById("zoom");
  document.getElementById("zoom-title").textContent = spot.name || "";
  document.getElementById("zoom-meta").textContent =
    `#${spot.spot_id} ${spot.adduct || ""} m/z ${fixed(spot.mz, 4)} RT ${fixed(spot.rt, 2)} / ${spot.verdict}`;
  // 大きさは表示してからでないと決まらない（clientWidth が 0）ので、開いてから描く。
  if (typeof dialog.showModal === "function") { if (!dialog.open) dialog.showModal(); }
  else dialog.setAttribute("open", "");
  drawEic(zoomEic, spot); drawIsotopes(zoomMs1, spot); drawMirror(zoomMirror, spot);
}

document.getElementById("zoom-close").addEventListener("click", closeZoom);
document.addEventListener("keydown", event => { if (event.key === "Escape") closeZoom(); });

function start() {
  document.getElementById("title").textContent = `Alignment curation — ${REVIEW.alignment.alignment_file}`;
  const select = document.getElementById("f-class"); select.textContent = "";
  for (const o of classFilterOptions(REVIEW.spots)) select.appendChild(el("option", {value: o.value}, o.label));
  for (const id of ["f-class", "f-verdict", "f-flag"]) document.getElementById(id).addEventListener("change", render);
  for (const c of EXCLUSION_ITEMS)
    document.getElementById("x-" + c).addEventListener("change", render);
  const warnings = document.getElementById("warnings");
  for (const w of REVIEW.warnings || []) warnings.appendChild(el("div", {class: "warn"}, w));
  for (const s of REVIEW.spots) if (isPresetTarget(s) && !edits.has(s.spot_id)) {
    edits.set(s.spot_id, presetEdit(s)); presetCount++;
    const cause = presetCause(s); presetCauses[cause] = (presetCauses[cause] || 0) + 1;
  }
  document.getElementById("status").textContent = countsText();
  renderTrends(); render();
}

document.getElementById("copy").addEventListener("click", async () => {
  const text = PREFIX + " " + JSON.stringify(submission());
  const area = document.getElementById("fallback");
  try { await navigator.clipboard.writeText(text); document.getElementById("status").textContent = "Copied. Paste it into the chat and send."; }
  catch { area.hidden = false; area.value = text; area.select(); document.getElementById("status").textContent = "Select the text below and copy it."; }
});

function afterRecorded(text, sent) {
  applyRecorded(REVIEW.spots, sent);
  clearSent(edits, sent); if (!edits.size) { presetCount = 0; presetCauses = {}; }
  render();
  document.getElementById("result").textContent = text;
}

const submitClient = startSubmitClient({onState: state => {
  showSubmitControls(state);
  if (state === "lost") openFallback(PREFIX + " " + JSON.stringify(submission()), lostText("en"));
}});

document.getElementById("submit").addEventListener("click", async () => {
  if (!edits.size) { document.getElementById("status").textContent = "No unsent changes."; return; }
  const payload = submission(), sent = new Map(edits);   // 送信中に変わった変更を巻き込まないよう、送る内容を控える
  if (!confirm(reviewConfirmText(payload.flags))) return;
  const button = document.getElementById("submit");
  button.disabled = true; document.getElementById("result").textContent = "Submitting…";
  const r = await submitClient.submit(payload);
  button.disabled = false;
  if (r.status === 200) { afterRecorded(tagsResultText(r.body, "en"), sent); return; }
  if (r.status !== 401 && r.status !== 0) {   // 未送信の変更は残す。401/0 は onState("lost") が理由を #result に書いたので消さない
    document.getElementById("result").textContent = "";
    showError(errorMessage(r.body) || `HTTP ${r.status}`);
  }
});

document.getElementById("finish").addEventListener("click", async () => {
  if (edits.size && !confirm(finishConfirmText(edits.size, "en"))) return;
  await submitClient.finish();
  document.getElementById("result").textContent = finishedText("en");
});

// ---- MCP Apps（ui:// で表示されたとき）。2026-09 時点で Claude Desktop のローカル stdio では未検証。 ----
let rpcId = 0; const pending = new Map();
function rpc(method, params) { const id = ++rpcId;
  window.parent.postMessage({jsonrpc: "2.0", id, method, params}, "*");
  return new Promise((resolve, reject) => pending.set(id, {resolve, reject})); }
function notify(method, params) { window.parent.postMessage({jsonrpc: "2.0", method, params}, "*"); }
function toolText(result) { return ((result && result.content) || []).filter(c => c.type === "text").map(c => c.text).join(""); }

function showError(message) { document.getElementById("status").textContent = "Error: " + String(message).slice(0, 300); }
function errorMessage(body) {
  if (!body || typeof body !== "object") return "Could not read the response";
  if (body.status === "error") return body.message || "Error";
  if (body.error) return body.error.message || body.error.code || "Error";
  return null;
}
function parseBody(text) { try { return JSON.parse(text); } catch { return null; } }

window.addEventListener("message", async event => {
  const m = event.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && pending.has(m.id)) { const p = pending.get(m.id); pending.delete(m.id);
    m.error ? p.reject(m.error) : p.resolve(m.result); return; }
  if (m.method === "ui/notifications/tool-result" && !REVIEW) {
    const match = /"review_id":"([^"]+)"/.exec(toolText(m.params)); if (!match) return;
    try {
      const spots = []; let meta = null;
      for (let page = 0; ; page++) {
        const text = toolText(await rpc("tools/call", {name: "curation_view_data",
          arguments: {review_id: match[1], page}}));
        const body = parseBody(text), problem = errorMessage(body);
        if (problem) { showError(problem || text); return; }
        meta = meta || body.review; spots.push(...body.spots); if (page + 1 >= body.n_pages) break;
      }
      REVIEW = {...meta, spots}; document.getElementById("send").hidden = false; start();
    } catch (err) { showError(err && err.message ? err.message : JSON.stringify(err)); }
  }
});

document.getElementById("send").addEventListener("click", async () => {
  if (!edits.size) { document.getElementById("status").textContent = "No unsent changes."; return; }
  const sent = new Map(edits);
  let text;
  try {
    text = toolText(await rpc("tools/call", {name: "curation_submit", arguments: {submission_text: PREFIX + " " + JSON.stringify(submission())}}));
  } catch (err) { showError(err && err.message ? err.message : JSON.stringify(err)); return; }
  const body = parseBody(text), problem = errorMessage(body);
  if (problem) { showError(problem); return; }        // 失敗したら未送信の変更は残す
  afterRecorded(text.slice(0, 200), sent);
});

if (REVIEW) start();
else if (window.parent !== window) {
  rpc("ui/initialize", {protocolVersion: "2025-06-18", appCapabilities: {},
                        clientInfo: {name: "ms-data-parser-curation", version: "1"}})
    .then(() => notify("ui/notifications/initialized", {}));
}
</script>
</body>
